# Gruvbox Light (medium) — палитра kitty для светлого режима.
#
# Применяется kitty (0.38+) автоматически, когда схема ОС — light. Источник
# цветов: alacritty/themes/themes/gruvbox_light.toml (те же hex, что в
# ghostty/themes/gruvbox-light); install/verify.sh сверяет палитры.
#
# Прозрачность. В файлах тем kitty background_opacity запрещён, поэтому
# непрозрачность светлой темы (в ghostty она 1.0) делается через
# transparent_background_colors: клетки с дефолтным фоном рендерятся
# с указанной opacity вместо базовой. Базовые 0.8 из kitty.conf остаются
# только клеткам с ПРИСВОЕННЫМ цветом (статус-бары TUI и т.п.) — там они
# слегка просвечивают, в ghostty такие клетки в light непрозрачны. Это
# единственное осознанное расхождение с ghostty. Если когда-нибудь kitty
# разрешит opacity в файлах тем — заменить на background_opacity 1.0.

background              #fbf1c7
foreground              #3c3836

# Выделение: bg2 — тёплое затемнение под светлую палитру (значения сверяются
# install/verify.sh с [colors.selection] в alacritty/themes/themes/gruvbox_light.toml).
selection_background    #d5c4a1
selection_foreground    #3c3836

# Курсор — инверсия клетки, как у alacritty/ghostty.
cursor                  #3c3836
cursor_text_color       #fbf1c7

url_color               #458588

color0                  #fbf1c7
color1                  #cc241d
color2                  #98971a
color3                  #d79921
color4                  #458588
color5                  #b16286
color6                  #689d6a
color7                  #7c6f64
color8                  #928374
color9                  #9d0006
color10                 #79740e
color11                 #b57614
color12                 #076678
color13                 #8f3f71
color14                 #427b58
color15                 #3c3836

active_tab_foreground   #fbf1c7
active_tab_background   #d5c4a1
inactive_tab_foreground #7c6f64
inactive_tab_background #ebdbb2
tab_bar_background      #ebdbb2

# Светлая тема непрозрачная (в ghostty: background-opacity = 1.0):
# дефолтный фон рисуется с opacity 1.0 вместо базовой 0.8.
transparent_background_colors #fbf1c7@1.0
