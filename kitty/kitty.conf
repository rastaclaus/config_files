# Kitty. Симлинк: ~/.config/kitty -> repo/kitty (см. install/symlinks.conf).
#
# Конфиг зеркалит ghostty/config.ghostty (см. docs/kitty.md): тот же шрифт, те
# же палитры, тот же модальный scroll-mode. Источник истины по версиям/опциям —
# `kitty +runpy` и локальные доки (/usr/share/doc/kitty/html); опции
# версионно-зависимы, проверено на 0.49.2.
#
# Прозрачность и палитры живут в dark-theme.auto.conf / light-theme.auto.conf:
# kitty (0.38+) сам следит за схемой через xdg-desktop-portal
# (org.freedesktop.appearance color-scheme; на этом десктопе его отдаёт darkman)
# и перекрашивает окна на смену схемы без перезапуска. Хук
# 22-kitty.sh (SIGUSR1) нужен для правок файлов тем и как страховка.
#
# Кастомный режим scroll-mode описан внизу файла.

# ---------------------------------------------------------------- шрифт
# 1:1 с ghostty и alacritty: fontconfig-«monospace» (на этой машине это
# Noto Sans Mono), размер 11.25. JetBrains Mono остаётся fallback для
# отсутствующих в Noto глифов — kitty подключает его сам через fontconfig.
font_family      Noto Sans Mono
font_size        11.25

# ----------------------------------------------------------------- окно
# niri/sway рисуют тайлинг сами, CSD не нужен (ghostty: window-decoration=none).
hide_window_decorations yes
# У ghostty/alacritty паддинги нулевые, у kitty дефолт тоже 0 — явно, чтобы
# не полагаться на дефолт.
window_padding_width 0

# Базовая прозрачность — под тёмную тему (dark-theme.auto.conf её не меняет;
# светлая тема глушит прозрачность через transparent_background_colors, см.
# комментарий там). Динамическая смена opacity (dynamic_background_opacity)
# не включается: она не переопределяется темами, а пер-режимная прозрачность
# живёт в файлах тем.
background_opacity 0.8

# ----------------------------------------------------------- скроллбек
# У alacritty history = 10000 строк, у ghostty scrollback-limit = 20 МБ
# (~10 700 строк в окне 1280 px). Берём те же 10 000 строк: память выделяется
# лениво, буфер живёт только в RAM и не переживает перезапуск.
scrollback_lines 10000

# ----------------------------------------------------------- поведение
# Курсор прячется сразу при наборе, показывается при движении мыши
# (ghostty: mouse-hide-while-typing). Отрицательное значение = прятать при
# наборе немедленно.
mouse_hide_wait -1

# Копирование по выделению: как в ghostty/Linux — выделение уходит только в
# PRIMARY (вставка — shift+insert или средняя кнопка). copy_on_select оставлен
# дефолтным: kitty и так кладёт выделение в PRIMARY.
# Вставка CLIPBOARD — ctrl+shift+v (стоковая).

# OSC 52: чтение клипборда удалённым приложением (nvim "+p). Дефолт kitty —
# read-clipboard-ask (запрос на каждое чтение); ghostty-конфиг ставит
# clipboard-read = allow. Здесь то же решение, тот же компромисс: любой процесс
# на сервере сможет прочитать локальный клипборд. Запись (write-clipboard,
# write-primary) и так разрешена по умолчанию.
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Диалог «закрыть окно с живым процессом?» выключен (ghostty:
# confirm-close-surface = false): работа живёт в tmux и nvim, лишний вопрос
# только мешает.
confirm_os_window_close 0

# Таб-бар: рисуется только когда табов больше одного; стиль — дефолтный.
# В niri обычно одно окно = один таб, бар не мешает.
tab_bar_min_tabs 2

# ------------------------------------------------------- ssh: terminfo
# sshd всегда передаёт TERM клиента: из kitty сессия приезжает как
# TERM=xterm-kitty. На сервере без этой записи tmux не стартует, а запись из
# старых ncurses не содержит Tc — tmux теряет truecolor.
#
# У kitty нет ghostty-аналога ssh-terminfo из shell integration, но есть ssh
# kitten (kitten ssh): он сам проливает terminfo на удалённый хост при первом
# подключении (~/.terminfo/x/xterm-kitty, без root). Ручной путь без kitten:
#   infocmp -a xterm-kitty | ssh host tic -x -o ~/.terminfo /dev/stdin
# Шортката нет: штатный ssh остаётся как есть, для серверов без записи —
# разовый infocmp | tic.
#
# tmux: terminal-overrides в .tmux.conf добавляет Tc только alacritty;
# xterm-kitty несёт Tc в самой записи, дефолт default-terminal не трогаем.
# Чтение клипборда из tmux (set-clipboard on) работает через OSC 52, его
# разрешает clipboard_control выше.

# ------------------------------------------- модальный scroll-mode (без мыши)
# Аналог ghostty key table scroll-mode: ctrl+shift+space входит в режим
# «скролл без мыши», q/escape выходят. В kitty для этого есть модальные
# keyboard modes (map --new-mode / map --mode, см. docs/mapping.rst).
#
# ВАЖНО:
#   * --on-unknown ignore обязателен: без него незабинженные клавиши пищат
#     (дефолт beep) — и это единственная защита от утечки букв в шелл, ловушки
#     ghostty-стиля catch_all здесь нет.
#   * --allow-fallback=shifted,ascii нужен на буквенных привязках: дефолт для
#     кастомных map — только shifted, и на русской раскладке «о» не нашла бы
#     физическую j. Стоковые шорткаты получают оба fallback автоматически.
#   * scroll_* действия работают только в main screen: в alt-screen (htop, vim,
#     less) режим входит, но ничего не листает — там скроллит само приложение
#     (в tmux — его copy-mode, prefix [).
#   * Выделение курсором с клавиатуры в kitty не существует: mouse_selection
#     берёт координаты указателя мыши, сдвинуть сам указатель с клавиатуры
#     нельзя (issue #719 закрыт апстримом со ссылкой на пейджер). Точный
#     mouseless-выделение даёт kitten hints (см. привязки ниже): он ищет на
#     экране слова/пути/URL/строки и копирует выбранное.
#   * y — «весь экран» = screen+scrollback, без text/html (ghostty: plain):
#     @screen_scrollback в launch, как write_screen_file у ghostty — история
#     ПЛЮС видимый экран, без отставания на экран строк.
map --new-mode scroll --on-unknown ignore ctrl+shift+space

map --mode scroll --allow-fallback=shifted,ascii j scroll_line_down
map --mode scroll --allow-fallback=shifted,ascii k scroll_line_up
# Полстраницы и страницы: у scroll_line_down/page нет аргумента-счётчика
# (только smooth), дробные величины даёт remote-control scroll-window; из map
# он работает без allow_remote_control.
map --mode scroll ctrl+d remote_control scroll-window 15l
map --mode scroll ctrl+u remote_control scroll-window 15l-
map --mode scroll space remote_control scroll-window 1p
map --mode scroll ctrl+f remote_control scroll-window 1p
map --mode scroll ctrl+b remote_control scroll-window 1p-
map --mode scroll g scroll_home
map --mode scroll --allow-fallback=shifted,ascii shift+g scroll_end
# Прыжки по промптам — по OSC 133-меткам shell integration (fish ставит их сам).
map --mode scroll ] scroll_to_prompt 1
map --mode scroll [ scroll_to_prompt -1
# Поиск открывает скроллбек в пейджере (less, / внутри него ищет дальше).
map --mode scroll / search_scrollback
# y — весь экран+история в CLIPBOARD как plain text; shift+y — в PRIMARY.
map --mode scroll --allow-fallback=shifted,ascii y launch --type=clipboard --stdin-source=@screen_scrollback cat
map --mode scroll --allow-fallback=shifted,ascii shift+y launch --type=primary --stdin-source=@screen_scrollback cat
# w — экран+история в nvim поверх окна (overlay), как ghostty-шный
# ctrl+alt+o через xdg-open shim, только без файла-посредника.
map --mode scroll --allow-fallback=shifted,ascii w launch --type=overlay --stdin-source=@screen_scrollback nvim -
# Точное mouseless-выделение: kitten hints подсвечивает кандидатов, буква —
# выбрать. --program=@ копирует в CLIPBOARD, * — в PRIMARY.
map --mode scroll --allow-fallback=shifted,ascii u kitten hints --type=url --program=@
map --mode scroll --allow-fallback=shifted,ascii p kitten hints --type=path --program=@
map --mode scroll --allow-fallback=shifted,ascii o kitten hints --type=line --program=@
map --mode scroll q pop_keyboard_mode
map --mode scroll escape pop_keyboard_mode

# Без входа в режим: весь экран+история в буфер (аналог ghostty ctrl+shift+y).
map ctrl+shift+y launch --type=clipboard --stdin-source=@screen_scrollback cat
# И одиночный nvim-дамп без входа в режим (аналог ghostty ctrl+alt+o).
map ctrl+alt+o launch --type=overlay --stdin-source=@screen_scrollback nvim -
