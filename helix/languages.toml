# Language server definitions (overrides built-in defaults).
# See ./languages.toml.example for a template on adding more languages.

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ty]
command = "ty"
args = ["server"]

# Helix uses `[language-server.ty.config]` for BOTH the `initializationOptions`
# of the `initialize` request and the reply to ty's `workspace/configuration`
# request. ty accepts these dynamic settings (diagnosticMode, completions, ...)
# in the initialization options too, but warns about any unrecognized top-level
# key. Wrapping them in a `ty` table (as the `workspace/configuration` *section*
# name would suggest) therefore triggers "Received unknown options during
# initialization", so the keys must stay at the top level here.
# `experimental.rename`/`experimental.autoImport` from the old config no longer
# exist (rename is always on; autoImport moved under completions).
[language-server.ty.config]
diagnosticMode = "workspace"
completions.autoImport = true

[language-server.tombi]
command = "tombi"
args = ["lsp"]

[language-server.fish-lsp]
command = "fish-lsp"
args = ["start"]

# Rust: surface `cargo clippy` lints through rust-analyzer.
[language-server.rust-analyzer.config]
check.command = "clippy"

# Python: type checking via ty, lint + formatting via ruff.
# auto-format is intentionally left off; format manually with :format
[[language]]
name = "python"
roots = ["pyproject.toml", ".git", "setup.py"]
language-servers = ["ty", "ruff"]
formatter = { command = "ruff", args = ["format", "--stdin-filename", "%{buffer_name}", "-"] }
indent = { tab-width = 4, unit = "    " }   # auto-indent = 4 spaces (PEP 8)

# The blocks below only override built-in defaults (servers/format). auto-format
# is left off; format manually with :format.

[[language]]
name = "toml"
language-servers = ["tombi"]
formatter = { command = "tombi", args = ["format", "-"] }

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "dockerfile"
language-servers = ["docker-langserver"]

[[language]]
name = "docker-compose"
language-servers = ["docker-compose-langserver", "yaml-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "bash"
language-servers = ["bash-language-server"]
formatter = { command = "shfmt" }

[[language]]
name = "fish"
language-servers = ["fish-lsp"]
formatter = { command = "fish_indent" }

[[language]]
name = "json"
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "rust"
language-servers = ["rust-analyzer"]

[[language]]
name = "c"
language-servers = ["clangd"]
formatter = { command = "clang-format" }

[[language]]
name = "cpp"
language-servers = ["clangd"]
formatter = { command = "clang-format" }

[[language]]
name = "go"
language-servers = ["gopls"]
formatter = { command = "gofmt" }
