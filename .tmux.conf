#### COLOUR (gruvbox)

# tmux >= 3.8 умеет тему клиента (опция theme) и theme*-имена цветов.
# Текущий режим выставляет wayland/theme-sync: `tmux set -s theme dark|light`.
# На более старых tmux остаётся прежняя статичная палитра Solarized.
%if #{m/r:^(3\.[0-7]a?|[0-2]\.[0-9]+[a-z]?)$,#{version}}
# default statusbar colors
set-option -g status-style fg=colour136,bg=colour235 #yellow and base02

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=default #base0 and default

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default #orange and default

# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour240 #base01

# message text
set-option -g message-style fg=colour166,bg=colour235 #orange and base02

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# bell
set-window-option -g window-status-bell-style fg=colour235,bg=colour160 #base02, red
%else
# Значения совпадают с alacritty/themes/themes/gruvbox_{dark,light}.toml.
set-option -g dark-theme-black       '#282828'
set-option -g dark-theme-white       '#ebdbb2'
set-option -g dark-theme-light-grey  '#928374'
set-option -g dark-theme-dark-grey   '#504945'
set-option -g dark-theme-red         '#fb4934'
set-option -g dark-theme-green       '#b8bb26'
set-option -g dark-theme-yellow      '#fabd2f'
set-option -g dark-theme-blue        '#83a598'
set-option -g dark-theme-cyan        '#8ec07c'
set-option -g dark-theme-magenta     '#d3869b'

set-option -g light-theme-black       '#fbf1c7'
set-option -g light-theme-white       '#3c3836'
set-option -g light-theme-light-grey  '#928374'
set-option -g light-theme-dark-grey   '#d5c4a1'
set-option -g light-theme-red         '#9d0006'
set-option -g light-theme-green       '#79740e'
set-option -g light-theme-yellow      '#b57614'
set-option -g light-theme-blue        '#076678'
set-option -g light-theme-cyan        '#427b58'
set-option -g light-theme-magenta     '#8f3f71'

# default statusbar colors
set-option -g status-style fg=themelightgrey,bg=themeblack

# default window title colors
set-window-option -g window-status-style fg=themelightgrey,bg=default

# active window title colors
set-window-option -g window-status-current-style fg=themeyellow,bg=default

# pane border
set-option -g pane-border-style fg=themedarkgrey
set-option -g pane-active-border-style fg=themelightgrey

# message text
set-option -g message-style fg=themeblack,bg=themeyellow

# pane number display
set-option -g display-panes-active-colour themecyan
set-option -g display-panes-colour themeyellow

# clock
set-window-option -g clock-mode-colour themegreen

# bell
set-window-option -g window-status-bell-style fg=themeblack,bg=themered
%endif

setw -g mode-keys vi
set-option -g set-clipboard on

set-option -ga terminal-overrides "alacritty:Tc"

# Место под имя сессии в статусной строке (дефолт tmux — 10)
set-option -g status-left-length 40


### Keys
unbind v
unbind h


unbind % # Split vertically
unbind '"' # Split horisontally

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"


bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind n  #DEFAULT KEY: Move to next window
unbind w  #DEFAULT KEY: change current window interactively

bind n command-prompt "rename-window '%%'"
bind w new-window -c "#{pane_current_path}"

bind -n M-j previous-window
bind -n M-k next-window

set -s escape-time 0
