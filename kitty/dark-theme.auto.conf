# Gruvbox Dark (medium) — палитра kitty для тёмного режима.
#
# Файл авто-темы kitty: kitty (0.38+) сам применяет его, когда схема ОС
# переключается в dark (xdg-desktop-portal org.freedesktop.appearance; на этом
# десктопе значение отдаёт darkman). На смену схемы kitty перекрашивает уже
# открытые окна без перезапуска; хук 22-kitty.sh (SIGUSR1) — для правок самого
# файла и как страховка, если портала нет.
#
# Источник цветов: alacritty/themes/themes/gruvbox_dark.toml (те же hex, что в
# ghostty/themes/gruvbox-dark). install/verify.sh сверяет палитры, чтобы
# терминалы на одном рабочем столе не разъезжались.
#
# В файле темы kitty допустимы только цветовые ключи (цвета, палитра,
# выделение, таб-бар, background_*); ключей вроде font_* тут быть не должно.
# background_opacity в темах kitty запрещён (в отличие от ghostty), базовые
# 0.8 заданы в kitty.conf — тёмная тема полупрозрачная, как в ghostty.

background              #282828
foreground              #ebdbb2

# Выделение: bg1 вместо bg2. bg2 (#504945) сам по себе светлый — на тёмном
# фоне он читается как подсветка из светлой темы. Значения сверяются
# install/verify.sh с [colors.selection] в alacritty/themes/themes/gruvbox_dark.toml.
selection_background    #3c3836
selection_foreground    #ebdbb2

# Курсор: у alacritty/ghostty он инвертирует клетку; дефолт kitty — статичный
# #cccccc, поэтому инверсию имитируем явно (fg на bg).
cursor                  #ebdbb2
cursor_text_color       #282828

url_color               #458588

color0                  #282828
color1                  #cc241d
color2                  #98971a
color3                  #d79921
color4                  #458588
color5                  #b16286
color6                  #689d6a
color7                  #a89984
color8                  #928374
color9                  #fb4934
color10                 #b8bb26
color11                 #fabd2f
color12                 #83a598
color13                 #d3869b
color14                 #8ec07c
color15                 #ebdbb2

# Активная вкладка — акцент gruvbox (как оранжевый выделения у апстрим-темы
# kitty), неактивная — фон панели темнее окна.
active_tab_foreground   #ebdbb2
active_tab_background   #504945
inactive_tab_foreground #a89984
inactive_tab_background #3c3836
tab_bar_background      #1d2021

# Прозрачность здесь не переключается: тема наследует background_opacity 0.8
# из kitty.conf (полупрозрачное тёмное окно, как в ghostty/alacritty).
