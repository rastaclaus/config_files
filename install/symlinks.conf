# Symbolic link map: <repo-path>  <target>  [tags]
#
#   repo-path : path inside this repo (relative)
#   target    : absolute destination ('~' is expanded to $HOME)
#   tags      : gui    — entry is applied only for profile=gui
#               merge  — target becomes a real dir with per-file links
#
# Host overrides are applied automatically: for a target under
#   ~/.config/<x>        -> hosts/<host>/config/<x>
#   ~/.local/share/<x>   -> hosts/<host>/local-share/<x>
#   ~/<x>                -> hosts/<host>/home/<x>
# If a host override exists, the target becomes a real directory and each
# entry is symlinked (common first, host wins on conflicts).

# --- editors / shells ---
# merge: target — реальный каталог с симлинками на файлы репо; рантайм-файлы
# (fish_variables, служебные файлы fish, ...) перечислены в volatile.conf.
fish                              ~/.config/fish                              merge
nvim                              ~/.config/nvim
helix                             ~/.config/helix                             merge
direnv                            ~/.config/direnv

# --- CLI dotfiles ---
.tmux.conf                        ~/.tmux.conf
.ruff.toml                        ~/.ruff.toml
# конфиг сессий fish_features=no-query-term (fish 4.x ждёт DA1-ответ 10 с в
# headless-PTY shpool; см. комментарий в shpool/config.toml)
shpool                            ~/.config/shpool

# --- desktop / Wayland (gui only) ---
sway                              ~/.config/sway                              gui
niri                              ~/.config/niri                              gui
wayland                           ~/.config/wayland                           gui
ironbar                           ~/.config/ironbar                           gui
waybar                            ~/.config/waybar                            gui
kitty                             ~/.config/kitty                             gui
wezterm                           ~/.config/wezterm                           gui
rofi                              ~/.config/rofi                              gui
darkman                           ~/.config/darkman                           gui
networkmanager-dmenu              ~/.config/networkmanager-dmenu              gui
xdg-desktop-portal                ~/.config/xdg-desktop-portal                gui
# единый хук darkman: уведомление + wayland/theme-sync (файл, не каталог)
darkman/theme                     ~/.local/share/darkman/theme                gui
applications/chromium-proxy.desktop    ~/.local/share/applications/chromium-proxy.desktop    gui
# xdg-autostart: гасим пакетную запись nm-applet — теперь он стартует из
# конфига композитора через wayland/wait-sni.sh (иначе systemd-овский инстанс
# выигрывает гонку и иконка навсегда уходит в невидимый legacy-режим).
autostart/nm-applet.desktop            ~/.config/autostart/nm-applet.desktop                gui
applications/chromium-wayland.desktop  ~/.local/share/applications/chromium-wayland.desktop  gui
applications/wezterm-sshmux-work.desktop  ~/.local/share/applications/wezterm-sshmux-work.desktop  gui

# --- user scripts (~/.local/bin) ---
# theme-switch работает и на headless: переключает state-файлы темы, GUI-часть
# theme-sync пропускает сам.
applications/theme-switch              ~/.local/bin/theme-switch
applications/chromium-proxy            ~/.local/bin/chromium-proxy                         gui
applications/chromium-wayland          ~/.local/bin/chromium-wayland                       gui
