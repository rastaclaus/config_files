# fish 4.x при интерактивном старте спрашивает терминал о его возможностях
# (Primary Device Attribute) и ждёт ответ ровно 10 секунд. В обычном терминале
# ответ приходит мгновенно, но под shpool во время handshake сессии байты
# наружу ещё не пересылаются — отвечать некому, и создание сессии занимает
# 10+ секунд (в логе демона это `wait_for_startup time.busy=10.3s`).
# Флаг отключает терминальные запросы только внутри shpool-сессий; kitty вне
# их работает как раньше. Ценой теряется автодетект терминала fish
# (фон темы, kitty-keyboard), в этом репо темы fish ведёт state-файл darkman.
[env]
fish_features = "no-query-term"
