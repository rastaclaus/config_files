# Gruvbox Light (medium) — палитра kitty для светлого режима.
#
# Применяется kitty (0.38+) автоматически, когда схема ОС — light.
#
# В файлах тем kitty допустимы только цветовые ключи; background_opacity в них
# запрещён, прозрачность задаётся в kitty.conf (здесь — не задаётся вовсе:
# конфиг дефолтный, окно непрозрачное).

background              #fbf1c7
foreground              #3c3836

# Выделение: bg2 — тёплое затемнение под светлую палитру.
selection_background    #d5c4a1
selection_foreground    #3c3836

# Курсор — инверсия клетки (fg на bg), как в тёмной теме.
cursor                  #3c3836
cursor_text_color       #fbf1c7

url_color               #458588

color0                  #fbf1c7
color1                  #cc241d
color2                  #98971a
color3                  #d79921
color4                  #458588
color5                  #b16286
color6                  #689d6a
color7                  #7c6f64
color8                  #928374
color9                  #9d0006
color10                 #79740e
color11                 #b57614
color12                 #076678
color13                 #8f3f71
color14                 #427b58
color15                 #3c3836

active_tab_foreground   #fbf1c7
active_tab_background   #d5c4a1
inactive_tab_foreground #7c6f64
inactive_tab_background #ebdbb2
tab_bar_background      #ebdbb2
