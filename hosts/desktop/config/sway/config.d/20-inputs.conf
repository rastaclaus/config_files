# Host: desktop (hostname: adesk)
# Host-specific input devices and pointer -> output mapping.

input "2522:8808:SONiX_USB_Keyboard" {
  repeat_delay 120
  repeat_rate 90
}

input "12538:768:USB_OPTICAL_MOUSE" {
    scroll_button button2
    scroll_method on_button_down
}

# Map the mouse to a specific output / back to all outputs.
bindsym Ctrl+Shift+o input "12538:768:USB_OPTICAL_MOUSE" map_to_output HDMI-A-1
bindsym Ctrl+Shift+p input "12538:768:USB_OPTICAL_MOUSE" map_to_output *
