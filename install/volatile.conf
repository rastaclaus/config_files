# Рантайм-файлы в merge-каталогах: копируются в target как обычные файлы,
# а не симлинкуются на репозиторий.
#
# Пути относительно корня репозитория; поддерживаются глобы (*, ?).
# Правила:
#   - файл копируется, только если его ещё нет в target;
#   - существующая локальная копия никогда не перезаписывается;
#   - старый симлинк внутрь репозитория заменяется копией.
#
# Так приложение может писать в файл, не меняя репозиторий.

# universal-переменные fish (EDITOR, fisher, ...)
fish/fish_variables

# служебные файлы fish, которые пересоздаёт сам fish
fish/conf.d/fish_frozen_theme.fish
fish/conf.d/fish_frozen_key_bindings.fish

# fisher ставит плагины локально (список плагинов — fish/fish_plugins)
fish/conf.d/fzf.fish
fish/functions/fisher.fish
fish/functions/fzf_configure_bindings.fish
fish/functions/_fzf_*.fish
fish/completions/fisher.fish
fish/completions/fzf_configure_bindings.fish

# OpenCode пишет сюда пароль локального сервера. Файл в git не попадает
# (opencode/.gitignore), а merge-раскладка не должна превращать его в ссылку:
# приложение писалo бы в репозиторий.
opencode/service.json
