# Map hostname -> host directory + install profile + compositor.
# Used by install.sh to auto-detect the current host.
#
# hostname     host-dir    profile     compositor
#
# compositor: what fish starts on tty1 (sway|niri|none). Written once to
# ~/.local/state/dotfiles/compositor by install.sh; after that `wm` owns the
# value, so editing this column does not move an already configured host.
# The headless profile always resolves to `none`, whatever is written here.
adesk          desktop     gui         niri
ambb           ambb        gui         sway
alen           alen        gui         sway
awdesk         work        headless    none
