# Colors (Gruvbox dark)

# Default colors
[colors.primary]
# hard contrast background = = '#1d2021'
background = '#282828'
# soft contrast background = = '#32302f'
foreground = '#ebdbb2'

# Selection colors
# bg2 (#504945) в gruvbox-раскладке светлый и на тёмном фоне читается как
# подсветка из светлой темы; bg1 (#3c3836) — мягкое затемнение, текст остаётся
# читаемым. verify.sh сверяет эти два hex с ghostty/themes/gruvbox-dark.
[colors.selection]
text = '#ebdbb2'
background = '#3c3836'

# Normal colors
[colors.normal]
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

# Bright colors
[colors.bright]
black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'
