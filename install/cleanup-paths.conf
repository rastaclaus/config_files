# Пути конфигов/state/cache, которые остаются после удаления пакета.
#
# Формат: <пакет> <путь>   — один путь на строку, разделитель — первый пробел,
# поэтому пробелы внутри пути допустимы. '#' — комментарий, глобы (*) работают.
#
# Путь с ~ (домашний каталог) обрабатывает --purge-configs.
# Путь с / (системный) обрабатывает --purge-system (через sudo).
#
# Явные записи нужны там, где имя каталога не совпадает с именем пакета
# (code -> ~/.config/Code). Всё остальное cleanup.sh находит сам по эвристике:
#   ~/.config/<pkg>  ~/.local/share/<pkg>  ~/.local/state/<pkg>  ~/.cache/<pkg>
# плюс регистронезависимое совпадение каталогов верхнего уровня.

# --- браузеры ---
chromium                  ~/.config/chromium
chromium                  ~/.config/chromium-proxy
chromium                  ~/.config/chromium-flags.conf
chromium                  ~/.cache/chromium
yandex-browser            ~/.config/yandex-browser
yandex-browser            ~/.cache/yandex-browser
qutebrowser               ~/.config/qutebrowser
qutebrowser               ~/.cache/qutebrowser

# --- редакторы / IDE ---
code                      ~/.config/Code
code                      ~/.vscode

# --- офис / документы ---
libreoffice-fresh         ~/.config/libreoffice
zathura                   ~/.config/zathura
zathura                   ~/.local/share/zathura
fbreader                  ~/.config/fbreader
fbreader                  ~/.local/share/fbreader
pdftricks                 ~/.config/pdftricks

# --- графика / фото / сканирование ---
gimp                      ~/.config/GIMP
gimp                      ~/.cache/gimp
eog                       ~/.config/eog
simple-scan               ~/.config/simple-scan

# --- медиа ---
vlc                       ~/.config/vlc
vlc                       ~/.local/share/vlc
transmission-gtk          ~/.config/transmission
transmission-gtk          ~/.local/share/transmission
fluidsynth                ~/.config/fluidsynth
fluidsynth                ~/.local/share/fluidsynth

# --- общение ---
telegram-desktop          ~/.local/share/TelegramDesktop
telegram-desktop          ~/.cache/TelegramDesktop
element-desktop           ~/.config/Element
mattermost-desktop        ~/.config/Mattermost

# --- игры ---
steam                     ~/.local/share/Steam
steam                     ~/.steam
steam                     ~/.config/steam
xonotic                   ~/.xonotic
wine                      ~/.wine
wine                      ~/.cache/wine
wine                      ~/.local/share/wineprefixes
winetricks                ~/.cache/winetricks

# --- VPN / сетевые клиенты ---
amneziavpn-bin            ~/.config/AmneziaVPN
amneziavpn-bin            ~/.local/share/AmneziaVPN
throne-bin                ~/.config/Throne
throne-bin                ~/.config/throne

# --- python / tex ---
mypy                      ~/.cache/mypy
ruff                      ~/.cache/ruff
texlive-basic             ~/.texlive*
texlive-latex             ~/.texlive*
texlive-latexextra        ~/.texlive*
texlive-latexrecommended  ~/.texlive*
texlive-langcyrillic      ~/.texlive*

# --- прочее ---
ranger                    ~/.config/ranger
the_silver_searcher       ~/.cache/ag
