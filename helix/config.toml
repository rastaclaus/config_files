theme = "gruvbox_light"

[editor]
line-number = "relative"
mouse = true
bufferline = "multiple"
color-modes = true
true-color = true
rulers = [120]
indent-heuristic = "tree-sitter"
shell = ["fish", "-c"]

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.file-picker]
hidden = false

[editor.soft-wrap]
enable = true

[editor.indent-guides]
render = true

[keys.insert]
"C-o" = "normal_mode"

