[preferred]
default=gtk
# niri recommends the GNOME backend for screencasting; wlr only supports
# wlroots compositors and is unreliable here.
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
org.freedesktop.impl.portal.Settings=darkman
# xdg-desktop-portal-gtk's implementation uses org.gnome.SessionManager and
# org.freedesktop.ScreenSaver, which niri does not implement. Disable it so
# apps use Wayland's native idle-inhibit protocol instead.
org.freedesktop.impl.portal.Inhibit=none
