# Kitty. Симлинк: ~/.config/kitty -> repo/kitty (см. install/symlinks.conf).
#
# Конфиг почти дефолтный: шрифт + файлы авто-темы. Палитры живут в
# dark-theme.auto.conf / light-theme.auto.conf (плюс
# no-preference-theme.auto.conf -> include light): kitty (0.38+) сам следит за
# схемой через xdg-desktop-portal (org.freedesktop.appearance color-scheme; на
# этом десктопе его отдаёт darkman) и перекрашивает окна на смену схемы без
# перезапуска. Хук 22-kitty.sh (SIGUSR1) нужен для правок файлов тем и как
# страховка, если портала нет.
#
# Подробности — docs/kitty.md.

# ---------------------------------------------------------------- пейджер
# История прокрутки (ctrl+shift+page_up) открывается в nvim. Рецепт из
# upstream-документации kitty (works for neovim 0.12+): скроллбак приезжает
# через stdin (argv «-»), буфер показывается в терминальном окне
# nvim_open_term, поэтому поиск /, навигация и всё остальное работают как в
# обычном nvim. INPUT_LINE_NUMBER kitty заменяет на строку, с которой надо
# открыть пейджер, чтобы он совпадал с текущим скроллом; q = ZQ выходит без
# сохранения, eventignore=FileType отключает ftplugin дляpager-буфера.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +INPUT_LINE_NUMBER -

# ---------------------------------------------------------------- клавиши
# Переключение вкладок kitty на alt+h / alt+l (нечувствительно к раскладке:
# kitty мапит по «букве» клавиши, а не по символу, так что работает и на ru).
# H/L выбраны под руку, Mod+H/Mod+L в niri заняты фокусом колонок.
map alt+h previous_tab
map alt+l next_tab

# Новая вкладка наследует рабочий каталог активного окна (экшен
# new_tab_with_cwd вместо дефолтного new_tab). Каталог kitty узнаёт через
# shell-интеграцию (OSC 7); внутри kitten ssh это приводит к переподключению
# на тот же хост в тот же каталог. С обычным ssh не работает — вкладка
# откроется локально. Наследование cwd внутри tmux не гарантируется.
map ctrl+shift+t new_tab_with_cwd

# ---------------------------------------------------------------- шрифт
# fontconfig-«monospace» (на этой машине это Noto Sans Mono), размер 11.25.
# JetBrains Mono остаётся fallback для отсутствующих в Noto глифов — kitty
# подключает его сам через fontconfig.
font_family      Noto Sans Mono
font_size        11.25
