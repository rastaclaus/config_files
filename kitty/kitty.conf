# Kitty. Симлинк: ~/.config/kitty -> repo/kitty (см. install/symlinks.conf).
#
# Конфиг почти дефолтный: шрифт + файлы авто-темы. Палитры живут в
# dark-theme.auto.conf / light-theme.auto.conf (плюс
# no-preference-theme.auto.conf -> include light): kitty (0.38+) сам следит за
# схемой через xdg-desktop-portal (org.freedesktop.appearance color-scheme; на
# этом десктопе его отдаёт darkman) и перекрашивает окна на смену схемы без
# перезапуска. Хук 22-kitty.sh (SIGUSR1) нужен для правок файлов тем и как
# страховка, если портала нет.
#
# Подробности — docs/kitty.md.

# ---------------------------------------------------------------- шрифт
# fontconfig-«monospace» (на этой машине это Noto Sans Mono), размер 11.25.
# JetBrains Mono остаётся fallback для отсутствующих в Noto глифов — kitty
# подключает его сам через fontconfig.
font_family      Noto Sans Mono
font_size        11.25
